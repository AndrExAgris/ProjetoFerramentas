name: Release

# Publica o APK assinado nas Releases do GitHub a cada tag vX.Y.Z (é o que o Obtainium acompanha).
# Para publicar: git tag v0.2.0 && git push origin v0.2.0
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v6

      - name: Conferir a chave de assinatura
        env:
          FT_KEYSTORE_BASE64: ${{ secrets.FT_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$FT_KEYSTORE_BASE64" ]; then
            echo "::error::Faltam os segredos da chave. Rode 'bash ferramentas/criar_chave.sh' uma vez no computador."
            exit 1
          fi
          echo "$FT_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Testar e gerar o APK assinado
        env:
          FT_KEYSTORE_ARQUIVO: ${{ runner.temp }}/release.jks
          FT_KEYSTORE_SENHA: ${{ secrets.FT_KEYSTORE_SENHA }}
          FT_CHAVE_ALIAS: ${{ secrets.FT_CHAVE_ALIAS }}
          FT_CHAVE_SENHA: ${{ secrets.FT_CHAVE_SENHA }}
        run: ./gradlew testDebugUnitTest assembleRelease -PversaoNome=${GITHUB_REF_NAME#v}

      - name: Publicar a release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao="${GITHUB_REF_NAME}"
          apk="ferramentas-${versao}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$apk"
          notas="docs/versoes/${versao}.md"
          if [ -f "$notas" ]; then
            gh release create "$versao" "$apk" --title "Ferramentas ${versao}" --notes-file "$notas"
          else
            gh release create "$versao" "$apk" --title "Ferramentas ${versao}" --generate-notes
          fi
